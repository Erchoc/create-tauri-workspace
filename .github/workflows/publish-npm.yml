name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test --workspace packages/create-tauri-workspace
      - run: npm pack --workspace packages/create-tauri-workspace --dry-run
      - run: npm publish --workspace packages/create-tauri-workspace --access public
