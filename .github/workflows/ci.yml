name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The template is the product. Generating a project and running its own
  # checks is the only thing that catches a template that no longer builds.
  template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Generate a project
        run: |
          node packages/create-tauri-workspace/bin/create-tauri-workspace.js smoke-app \
            --output "$RUNNER_TEMP" \
            --identifier dev.example.smokeapp \
            --repo example/smoke-app \
            --no-git
      - name: Check the generated project
        working-directory: ${{ runner.temp }}/smoke-app
        run: bun run check
      - name: Confirm the release check reports a clean project
        working-directory: ${{ runner.temp }}/smoke-app
        run: bun run release:check
