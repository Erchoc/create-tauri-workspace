name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fails in about a minute instead of after a full cross-platform build.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      updater: ${{ steps.config.outputs.updater }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - id: config
        name: Read release configuration
        run: |
          read_config() {
            node -p "JSON.parse(require('fs').readFileSync('crates/app/tauri.conf.json','utf8'))$1"
          }
          {
            echo "updater=$(read_config '.bundle.createUpdaterArtifacts === true')"
            echo "version=$(read_config '.version')"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the tag matches the configured version
        run: |
          expected="v${{ steps.config.outputs.version }}"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match $expected from tauri.conf.json."
            exit 1
          fi
      - name: Verify the update signing secret
        if: steps.config.outputs.updater == 'true'
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Updater artifacts are enabled but TAURI_SIGNING_PRIVATE_KEY is not set. Run bun run updater:init and upload the key it reports."
            exit 1
          fi
      - name: Report unsigned platforms
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No Apple signing identity. macOS builds will be unsigned, Gatekeeper will refuse to open them, and macOS updates cannot install."
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            rust-targets: ""
            args: "--bundles appimage,deb"
          - platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: windows-latest
            rust-targets: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update package. Required when updater artifacts are on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer credentials. Each is optional: when a value is
          # empty the action skips that step and produces an unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: crates/app
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: "__PROJECT_DISPLAY_NAME__ v__VERSION__"
          releaseBody: "Download the installer for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
